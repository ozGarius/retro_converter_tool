name: Build Windows EXE

on:
  push:
    branches:
      - main # Run on pushes to the main branch
      - develop # Run on pushes to the develop branch for testing
  workflow_dispatch: # Allow manual triggering

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.3' # Specify Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PyInstaller
        run: |
          cd src
          pyinstaller --onefile --windowed --name converter --icon converter_tools/assets/icons/app_icon.ico --add-data "converter_tools/assets;converter_tools/assets" --add-data "converter_tools/converter_settings.json;converter_tools" converter.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: converter-windows-exe
          path: src/dist/converter.exe # Path to the generated EXE
